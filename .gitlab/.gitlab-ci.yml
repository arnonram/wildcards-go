stages:
  - quality
  - publish

# Merge requests, main after each merge, and release tags (vX.Y.Z).
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Checks run on merge requests and main; a tag's commit already passed them there.
.not-on-tags:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

lint:
  extends: .not-on-tags
  image:
    name: ghcr.io/biomejs/biome:2.6.3
    entrypoint: [""]
  stage: quality
  script:
    - biome ci --reporter=gitlab --colors=off > /tmp/code-quality.json
    - cp /tmp/code-quality.json code-quality.json
  artifacts:
    reports:
      codequality:
        - code-quality.json

.bun:
  extends: .not-on-tags
  image: oven/bun:1.4.2
  stage: quality
  before_script:
    - bun install --frozen-lockfile

typecheck:
  extends: .bun
  script:
    - bunx tsc --noEmit -p .

build:
  extends: .bun
  script:
    - bun run build

test:
  extends: .bun
  services:
    - name: mongo:9.0.2
      alias: mongo
  variables:
    MONGODB_URI: mongodb://mongo:27017
    MONGODB_DB: wcg_test
  script:
    - bun test --coverage --coverage-reporter=text --coverage-reporter=lcov --reporter=junit --reporter-outfile=junit.xml
  # Line coverage from Bun's "All files" row (% Funcs, then % Lines).
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
    reports:
      junit: junit.xml

# GitLab annotates MR diffs from Cobertura; Bun only writes lcov.
coverage-report:
  extends: .not-on-tags
  image: python:3.13-slim
  stage: quality
  needs: [test]
  script:
    - pip install --quiet lcov_cobertura==2.1.1
    - lcov_cobertura coverage/lcov.info --base-dir . --output coverage/cobertura.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs

# Merge requests that change how the image is built prove it still builds,
# without pushing anything.
docker-build:
  extends: .docker
  stage: quality
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - Dockerfile
        - .dockerignore
        - next.config.js
        - package.json
        - bun.lock
  script:
    - docker build -t wcg:mr .

# The self-hosting image: :latest and :<sha> from main, :X.Y.Z from a vX.Y.Z tag.
docker-image:
  extends: .docker
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="${CI_COMMIT_TAG#v}"
      else
        TAGS="latest $CI_COMMIT_SHA"
      fi
      for tag in $TAGS; do
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$tag"
        docker push "$CI_REGISTRY_IMAGE:$tag"
      done
