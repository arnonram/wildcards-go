stages:
  - quality

# Merge requests, and main after each merge.
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:
  image:
    name: ghcr.io/biomejs/biome:2.6.3
    entrypoint: [""]
  stage: quality
  script:
    - biome ci --reporter=gitlab --colors=off > /tmp/code-quality.json
    - cp /tmp/code-quality.json code-quality.json
  artifacts:
    reports:
      codequality:
        - code-quality.json

.bun:
  image: oven/bun:1.4.2
  stage: quality
  before_script:
    - bun install --frozen-lockfile

typecheck:
  extends: .bun
  script:
    - bunx tsc --noEmit -p .

build:
  extends: .bun
  script:
    - bun run build

test:
  extends: .bun
  services:
    - name: mongo:9.0.2
      alias: mongo
  variables:
    MONGODB_URI: mongodb://mongo:27017
    MONGODB_DB: wcg_test
  script:
    - bun test --coverage --coverage-reporter=text --coverage-reporter=lcov --reporter=junit --reporter-outfile=junit.xml
  # Line coverage from Bun's "All files" row (% Funcs, then % Lines).
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
    reports:
      junit: junit.xml

# GitLab annotates MR diffs from Cobertura; Bun only writes lcov.
coverage-report:
  image: python:3.13-slim
  stage: quality
  needs: [test]
  script:
    - pip install --quiet lcov_cobertura==2.1.1
    - lcov_cobertura coverage/lcov.info --base-dir . --output coverage/cobertura.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
