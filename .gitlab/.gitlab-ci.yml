stages:
  - quality

# Merge requests, and main after each merge.
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:
  image:
    name: ghcr.io/biomejs/biome:2.6.3
    entrypoint: [""]
  stage: quality
  script:
    - biome ci --reporter=gitlab --colors=off > /tmp/code-quality.json
    - cp /tmp/code-quality.json code-quality.json
  artifacts:
    reports:
      codequality:
        - code-quality.json

.bun:
  image: oven/bun:1.4.2
  stage: quality
  before_script:
    - bun install --frozen-lockfile

typecheck:
  extends: .bun
  script:
    - bunx tsc --noEmit -p .

build:
  extends: .bun
  script:
    - bun run build

test:
  extends: .bun
  services:
    - name: mongo:6
      alias: mongo
  variables:
    MONGODB_URI: mongodb://mongo:27017
    MONGODB_DB: wcg_test
  script:
    - bun test --reporter=junit --reporter-outfile=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
