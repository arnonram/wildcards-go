# A vX.Y.Z tag publishes :X.Y.Z. No checks here: tags are cut from main,
# whose commit already passed them in ci.yml.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/docker-builder.yml
    with:
      push: true
    permissions:
      contents: read
      packages: write
