# Builds the self-hosting image and, when asked, pushes it to ghcr.io.
#
# Called by:
#   ci.yml                 main          → :latest and :<sha>
#   release.yml            vX.Y.Z tag    → :X.Y.Z
#   docker-build-test.yml  pull requests → build only, nothing pushed
#
# Permissions come from the calling job: pushing needs `packages: write` there.
name: Docker builder

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to ghcr.io
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=ref,event=pr
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
